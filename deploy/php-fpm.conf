; Installed as /etc/dunamismax/php-fpm.conf by 01-provision.sh and linked as
; /etc/php/8.5/fpm/pool.d/dunamismax.conf. The shared php8.5-fpm service runs
; every site's pool: reload it, never restart it.
[dunamismax]
user = dunamismax
group = dunamismax

listen = /run/php/dunamismax.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0600

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[zend.exception_ignore_args] = on
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 30
